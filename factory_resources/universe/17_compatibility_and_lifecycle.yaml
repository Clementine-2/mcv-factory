      note: "阶段 E：overlay 可更新，用户源文件不被盖"
    - id: provider-upgrade
      status: owned
      note: "P8 升级矩阵。不得把 observed_latest 自动升成 supported"
    - id: breaking-change-policy
      status: observed
    - id: profile-deprecate
      status: observed
      note: "旧手写 MV3 在 WXT 继任后仍保留一段时间"
    - id: rollback
      status: owned
    - id: recovery-checkpoint
      status: owned
      note: "工厂机床侧 checkpoint；用户项目侧 lock/rollback"
