schema: project-factory-warehouse/2
stage: A.1

compatibility_axes:
  slot: compatibility_axis
  items:
    - id: os-windows
      status: owned
      note: "工厂自己跑在 Windows；用户项目另填"
    - id: os-linux
      status: observed
    - id: os-macos
      status: observed
    - id: arch-x64
      status: observed
    - id: arch-arm64
      status: observed
    - id: runtime-cpython
      status: owned
    - id: runtime-node
      status: owned
    - id: runtime-browser
      status: owned
      limitation: "扩展真机 UNVERIFIED"
