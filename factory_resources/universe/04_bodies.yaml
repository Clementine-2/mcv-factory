# 轮子 = 生成项目里的车身框架。每个类目收最成熟的几个，不是 GitHub 搜到的全收。
# 调查锚点：SO 2025 web（Node 48.7 React 44.7 Next 20.8 Express 19.9 ASP.NET Core 19.7
# Angular 18.2 Vue 17.6 FastAPI 14.8 Spring Boot 14.7 Flask 14.4）；
# CLI 王者：Typer / Click / Cobra / Clap / Commander；
# MCP 官方 SDK 分档；桌面优先非 Electron；移动 Flutter / Expo / KMP。
schema: project-factory-warehouse/2
slot: generated_body

