[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "project-factory-trusted-lab"
version = "2.0.0"
description = "P9 local-only trusted extension wheel smoke fixture"
requires-python = ">=3.11"

[project.entry-points."project_factory.extensions"]
trusted-lab = "trusted_lab_extension:register"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
